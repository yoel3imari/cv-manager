<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#154BA8" />
      <stop offset="55%" stop-color="#0D3880" />
      <stop offset="100%" stop-color="#071E48" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F7FB" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0D3880" />
    </linearGradient>
    <filter id="docShadow" x="-10%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#030D22" flood-opacity="0.45" />
    </filter>
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#030D22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- macOS / Tauri Squircle Background -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bgGrad)" />
  <rect x="68" y="68" width="888" height="888" rx="206" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="8" />

  <!-- Subtle Background Grid Accent -->
  <circle cx="820" cy="200" r="220" fill="#3B82F6" fill-opacity="0.12" />
  <circle cx="210" cy="820" r="240" fill="#60A5FA" fill-opacity="0.08" />

  <!-- A4 Document Sheet with Folded Top-Right Corner -->
  <g filter="url(#docShadow)">
    <path d="M256 176 H648 L768 296 V824 C768 850.5 746.5 872 720 872 H256 C229.5 872 208 850.5 208 824 V224 C208 197.5 229.5 176 256 176 Z" fill="url(#pageGrad)" />
    <!-- Folded Corner Flap -->
    <path d="M648 176 V264 C648 281.7 662.3 296 680 296 H768 L648 176 Z" fill="#DCE6F7" />
  </g>

  <!-- CV Document Header Content -->
  <rect x="272" y="244" width="280" height="34" rx="10" fill="#0D3880" />
  <rect x="272" y="294" width="190" height="18" rx="6" fill="#64748B" />

  <!-- Section 1 Divider & Lines -->
  <rect x="272" y="346" width="432" height="6" rx="3" fill="#0D3880" fill-opacity="0.85" />
  <rect x="272" y="372" width="140" height="16" rx="5" fill="#1E293B" />
  <rect x="614" y="372" width="90" height="16" rx="5" fill="#94A3B8" />
  <rect x="272" y="402" width="410" height="13" rx="4" fill="#64748B" fill-opacity="0.65" />
  <rect x="272" y="426" width="360" height="13" rx="4" fill="#64748B" fill-opacity="0.65" />

  <!-- Section 2 Divider & Project Bullet Lines -->
  <rect x="272" y="478" width="432" height="6" rx="3" fill="#0D3880" fill-opacity="0.85" />
  <circle cx="284" cy="512" r="7" fill="#0D3880" />
  <rect x="304" y="504" width="175" height="16" rx="5" fill="#1E293B" />
  <rect x="492" y="504" width="120" height="16" rx="5" fill="#2563EB" fill-opacity="0.25" />
  <rect x="304" y="532" width="385" height="13" rx="4" fill="#64748B" fill-opacity="0.65" />
  <rect x="304" y="556" width="330" height="13" rx="4" fill="#64748B" fill-opacity="0.65" />

  <circle cx="284" cy="602" r="7" fill="#0D3880" />
  <rect x="304" y="594" width="195" height="16" rx="5" fill="#1E293B" />
  <rect x="304" y="622" width="370" height="13" rx="4" fill="#64748B" fill-opacity="0.65" />
  <rect x="304" y="646" width="290" height="13" rx="4" fill="#64748B" fill-opacity="0.65" />

  <!-- Section 3 Skills Pills -->
  <rect x="272" y="698" width="432" height="6" rx="3" fill="#0D3880" fill-opacity="0.85" />
  <rect x="272" y="724" width="110" height="26" rx="8" fill="#E2E8F0" />
  <rect x="394" y="724" width="130" height="26" rx="8" fill="#E2E8F0" />
  <rect x="536" y="724" width="95" height="26" rx="8" fill="#E2E8F0" />

  <!-- Floating "TeX" Studio Pill Badge (Bottom Right) -->
  <g filter="url(#badgeShadow)">
    <rect x="530" y="716" width="286" height="128" rx="36" fill="url(#badgeGrad)" stroke="#FFFFFF" stroke-width="8" />
    <text x="673" y="803" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="82" letter-spacing="1">TeX</text>
  </g>
</svg>
